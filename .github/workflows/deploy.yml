name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # NOTE_INDEX.md / backlink commit-back 용
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply link requests (LINK_REQUESTS.json)
        run: |
          if [ -f LINK_REQUESTS.json ]; then
            echo "LINK_REQUESTS.json 발견 — 처리 중..."
            if node scripts/apply-link-requests.mjs; then
              git add src/content/notes/
              git add -u LINK_REQUESTS.json   # 삭제된 tracked 파일 staging
              if ! git diff --cached --quiet; then
                git commit -m "chore: apply backlink requests [skip ci]"
                git push origin HEAD:main
              fi
            else
              echo "⚠️  처리 실패 — LINK_REQUESTS.json을 보존합니다."
            fi
          fi

      - name: Update NOTE_INDEX.md
        run: |
          node scripts/generate-note-index.mjs
          git add NOTE_INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update NOTE_INDEX.md [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build (Astro + Pagefind)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
